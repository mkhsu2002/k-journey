name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version-*.html'
      - 'assets/**'
      - 'scripts/build.cjs'
      - 'scripts/verify-deployment.py'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'

permissions:
  contents: read

concurrency:
  group: k-journey-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy production
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name k-journey --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production commit and every public file
        run: python3 scripts/verify-deployment.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_COMMIT: ${{ github.sha }}
